[package]
name = "{{ project-name }}-ebpf"
version = "0.1.0"
edition.workspace = true

[dependencies]
{{ project-name }}-common = { path = "../{{ project-name }}-common" }

aya-ebpf = { workspace = true }
aya-log-ebpf = { workspace = true }
{% if use_network_types %}
network-types = "0.1.0"
{% endif %}

[build-dependencies]
which = { workspace = true }

[[bin]]
name = "{{ project-name }}"
path = "src/main.rs"
